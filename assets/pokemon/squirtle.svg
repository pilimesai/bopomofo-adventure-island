<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="squirtleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93E5FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <!-- 捲曲水流尾巴 -->
  <path d="M 55 145 C 30 160, 20 135, 30 120 C 40 105, 50 125, 45 130" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />

  <!-- 龜殼邊緣與腹甲 -->
  <ellipse cx="100" cy="144" rx="48" ry="40" fill="#78350F" stroke="#2D3748" stroke-width="3" />
  <ellipse cx="100" cy="145" rx="38" ry="32" fill="url(#shellGrad)" stroke="#451A03" stroke-width="2" />
  <!-- 腹甲紋理 -->
  <line x1="100" y1="115" x2="100" y2="175" stroke="#713F12" stroke-width="2" />
  <line x1="65" y1="145" x2="135" y2="145" stroke="#713F12" stroke-width="2" />

  <!-- 圓滾滾頭部 -->
  <ellipse cx="100" cy="90" rx="46" ry="40" fill="url(#squirtleGrad)" stroke="#2D3748" stroke-width="3" />

  <!-- 紅紫色大萌眼 -->
  <ellipse cx="78" cy="85" rx="9" ry="12" fill="#9333EA" stroke="#2D3748" stroke-width="2" />
  <circle cx="76" cy="80" r="4" fill="#FFFFFF" />
  <ellipse cx="122" cy="85" rx="9" ry="12" fill="#9333EA" stroke="#2D3748" stroke-width="2" />
  <circle cx="120" cy="80" r="4" fill="#FFFFFF" />

  <!-- 微笑嘴巴 -->
  <path d="M 88 102 Q 100 114 112 102" fill="none" stroke="#2D3748" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 94 105 Q 100 112 106 105 Z" fill="#F43F5E" />

  <!-- 手手與腳腳 -->
  <ellipse cx="70" cy="178" rx="13" ry="8" fill="url(#squirtleGrad)" stroke="#2D3748" stroke-width="2.5" />
  <ellipse cx="130" cy="178" rx="13" ry="8" fill="url(#squirtleGrad)" stroke="#2D3748" stroke-width="2.5" />
  <ellipse cx="68" cy="132" rx="9" ry="6" fill="url(#squirtleGrad)" stroke="#2D3748" stroke-width="2" />
  <ellipse cx="132" cy="132" rx="9" ry="6" fill="url(#squirtleGrad)" stroke="#2D3748" stroke-width="2" />
</svg>

