<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="eeveeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C28D58" />
      <stop offset="100%" stop-color="#8B5A2B" />
    </linearGradient>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
  </defs>

  <!-- 蓬鬆大尾巴 -->
  <path d="M 50 145 C 10 160, 5 105, 30 90 C 50 78, 65 110, 55 135 Z" fill="url(#eeveeGrad)" stroke="#2D3748" stroke-width="3" />
  <!-- 尾巴蓬鬆白毛端 -->
  <path d="M 28 92 C 38 85, 48 95, 38 105 C 32 108, 22 100, 28 92 Z" fill="url(#furGrad)" />

  <!-- 兩隻長長大兔耳 -->
  <g transform="rotate(-30 65 45)">
    <path d="M 50 75 C 30 35, 45 5, 68 0 C 85 5, 85 35, 75 75 Z" fill="url(#eeveeGrad)" stroke="#2D3748" stroke-width="3" />
    <path d="M 58 60 C 45 35, 55 15, 68 12 C 78 15, 75 35, 70 60 Z" fill="#4A2810" />
  </g>
  <g transform="rotate(30 135 45)">
    <path d="M 125 75 C 115 35, 115 5, 132 0 C 155 5, 170 35, 150 75 Z" fill="url(#eeveeGrad)" stroke="#2D3748" stroke-width="3" />
    <path d="M 130 60 C 125 35, 122 15, 132 12 C 145 15, 155 35, 142 60 Z" fill="#4A2810" />
  </g>

  <!-- 身體 -->
  <ellipse cx="100" cy="145" rx="44" ry="36" fill="url(#eeveeGrad)" stroke="#2D3748" stroke-width="3" />

  <!-- 招牌超蓬鬆奶油頸毛 -->
  <path d="M 60 120 C 50 135, 70 155, 85 145 C 95 160, 105 160, 115 145 C 130 155, 150 135, 140 120 C 130 110, 70 110, 60 120 Z" 
        fill="url(#furGrad)" stroke="#2D3748" stroke-width="2.5" />

  <!-- 腳腳 -->
  <ellipse cx="75" cy="178" rx="12" ry="7" fill="url(#eeveeGrad)" stroke="#2D3748" stroke-width="2.5" />
  <ellipse cx="125" cy="178" rx="12" ry="7" fill="url(#eeveeGrad)" stroke="#2D3748" stroke-width="2.5" />

  <!-- 大大萌頭 -->
  <ellipse cx="100" cy="90" rx="46" ry="38" fill="url(#eeveeGrad)" stroke="#2D3748" stroke-width="3" />

  <!-- 水靈靈黑棕大眼睛 -->
  <ellipse cx="76" cy="85" rx="8.5" ry="11" fill="#3D1C00" stroke="#2D3748" stroke-width="2" />
  <circle cx="74" cy="81" r="3.5" fill="#FFFFFF" />
  <ellipse cx="124" cy="85" rx="8.5" ry="11" fill="#3D1C00" stroke="#2D3748" stroke-width="2" />
  <circle cx="122" cy="81" r="3.5" fill="#FFFFFF" />

  <!-- 小黑鼻子與微笑 -->
  <polygon points="100,92 97,89 103,89" fill="#222222" />
  <path d="M 94 98 Q 100 104 106 98" fill="none" stroke="#2D3748" stroke-width="2" stroke-linecap="round" />
</svg>
